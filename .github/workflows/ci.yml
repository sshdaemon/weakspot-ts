name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole suite takes seconds; a hung engine child must not hold a runner for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest major the CLI runs on (type stripping), 24 is what it is developed on.
        node: [22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:contract
